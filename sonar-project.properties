# Configuración de SonarQube Cloud para el backend. La lee el paso "SonarQube Scan" de
# .github/workflows/backend-tests.yml (el analizador busca este archivo en la raíz del repo).

sonar.projectKey=wsernam_A-Walking-Dictionary-NovaCode-Back-end
sonar.organization=wsernam
sonar.projectName=A-Walking-Dictionary-NovaCode-Back-end

sonar.sources=backend/src
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8

# Reporte de cobertura que genera "npm run test:coverage" (Vitest + coverage-v8).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Excluidos SOLO del cálculo de cobertura (se siguen analizando para bugs, code smells y
# vulnerabilidades). Decisión del equipo 2026-10-10:
# - routes, models y config solo declaran rutas, campos y la conexión; no tienen lógica que probar.
# - repositories son consultas SQL; se prueban con una base de datos real (pendiente), no con mocks.
# - 5 controladores que solo usan rutas NO montadas en app.js (inalcanzables para cualquier usuario).
# El código de HU pendientes (WordNet, Estudio, Diccionario) NO se excluye: cuenta como no cubierto.
# Mantener esta lista igual a coverage.exclude de backend/vitest.config.js.
sonar.coverage.exclusions=backend/src/routes/**,backend/src/models/**,backend/src/config/**,backend/src/repositories/**,\
  backend/src/controllers/PreguntaQuizController.js,\
  backend/src/controllers/EtiquetaContextoController.js,\
  backend/src/controllers/RespuestaQuizController.js,\
  backend/src/controllers/ProgresoEstudioController.js,\
  backend/src/controllers/QuizMazoController.js
