name: Backend tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # SonarQube necesita el historial completo para atribuir los cambios

      - uses: actions/setup-node@v4
        with:
          node-version: 20          # misma versión que los Dockerfiles (node:20-alpine)
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage  # pruebas + backend/coverage/lcov.info para SonarQube

      # Análisis de calidad: lee sonar-project.properties de la raíz del repo.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
