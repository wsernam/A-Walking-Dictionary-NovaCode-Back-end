name: Backend tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube necesita el historial completo.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Pruebas unitarias y cobertura
        run: npm run test:coverage

      # Lee sonar-project.properties desde la raíz del repositorio.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  integracion-hu023:
    name: HU-023 - Integración CA-23.4
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hu023_test
          POSTGRES_PASSWORD: hu023_local_test
          POSTGRES_DB: walking_dictionary_hu023_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hu023_test -d walking_dictionary_hu023_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Ejecutar integración de CA-23.4
        run: >-
          npm run test:integracion:hu023 --
          --reporter=default
          --reporter=junit
          --outputFile=reportes-integracion/hu023-junit.xml

      - name: Publicar resultados de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hu023-integracion-resultados
          path: backend/reportes-integracion/hu023-junit.xml
          if-no-files-found: warn