name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '0 6 * * 1'   # cada lunes, para detectar vulnerabilidades nuevas en código que no cambió

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # publicar los hallazgos en la pestaña Security del repo
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
