        '500': { $ref: '#/components/responses/InternalError' }
  # ======================= aportes =======================
  /aportes/pending:
    get:
      tags: [aportes]
      operationId: listarCoautoriasPendientes
      summary: Lista las coautorías y acepciones pendientes
      description: |
        Solo docente. Endpoint adicional (fuera de los CA de HU-1.3). Aportes `coautoria` y `acepcion_nueva`
        en `pendiente_revision`, aunque su tarjeta ya esté aprobada, con los datos de la tarjeta.
        Responde con `Cache-Control: no-store`.
      x-hu: HU-1.3
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Aportes pendientes, del más antiguo al más reciente.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AportePendiente' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /aportes:
    post:
      tags: [aportes]
      operationId: crearAporte
      summary: Crea un aporte (CRUD genérico)
      description: |
        Requiere sesión (cualquier rol). CRUD genérico: guarda las columnas del body tal como llegan, sin las
        reglas de HU-1.2/HU-1.3 (para registrar palabras se usa POST /decks/{id}/cards). Solo valida que vengan
        `traduccion_aportada` y `tipo_aporte` y las longitudes máximas; si falta otra columna NOT NULL o una
        foreign key no existe, responde 500.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [traduccion_aportada, tipo_aporte]
              properties:
                tarjeta_id: { type: integer }
                inscripcion_id: { type: integer }
                traduccion_aportada: { type: string, maxLength: 255 }
                definicion_aportada: { type: string }
                ejemplo_aportado: { type: string, maxLength: 150 }
                tipo_aporte: { type: string, maxLength: 40, enum: [creada, coautoria, acepcion_nueva] }
      responses:
        '201':
          description: Aporte creado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Aporte' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [aportes]
      operationId: listarAportes
      summary: Lista todos los aportes
      description: Requiere sesión (cualquier rol). Todos los aportes, sin filtros ni paginación.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de aportes.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Aporte' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /aportes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [aportes]
      operationId: obtenerAporte
      summary: Obtiene un aporte
      description: Requiere sesión (cualquier rol).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: El aporte.
          content: { application/json: { schema: { $ref: '#/components/schemas/Aporte' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
