      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nivel_ingles: { type: string, enum: [A1, A2, B1, B2, C1, C2] }
                codigo_estudiantil: { type: string, maxLength: 20 }
                avatar: { type: string, maxLength: 500, description: URL o ruta de la imagen; se rechaza un data URI }
                intereses: { type: array, items: { type: string, minLength: 1 } }
      responses:
        '200':
          description: Perfil actualizado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Perfil' } } }
        '400':
