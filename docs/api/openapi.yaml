openapi: 3.0.3
info:
  title: A Walking Dictionary API
  version: 0.1.0
  description: |
    API REST del proyecto A Walking Dictionary (curso de Literatura Anglófona, Universidad del Cauca).
    Todas las rutas cuelgan de `/api/v1`. Las respuestas de error tienen la forma `{ error, code }`:
    `error` es el mensaje en español y `code` es un código fijo en inglés (ver `docs/codigos-error.md`).
    Los endpoints marcados con `x-pendiente` documentan lo que hace el código hoy y tienen una
    discrepancia abierta con el backlog.

    Convenciones de esta especificación:
    - Solo se documentan las rutas montadas en `backend/src/app.js`.
    - `x-hu` y `x-ca` enlazan cada operación con su historia de usuario y criterios de aceptación.
    - Los nombres de los schemas y campos son los del DER (`init.sql`, en singular).
    - Las columnas `DATE` (por ejemplo `mazo.fecha_apertura`) se serializan como fecha-hora ISO 8601.
    - Las columnas `DECIMAL` llegan como texto desde PostgreSQL (observación abierta, sin corregir).
servers:
  - url: http://localhost:5000/api/v1
    description: Desarrollo local
tags:
  - { name: auth, description: 'Autenticación y registro (HU-5.1, HU-5.4)' }
  - { name: decks, description: 'Mazos (HU-1.1, HU-1.2, HU-3.3)' }
  - { name: cards, description: 'Tarjetas y curaduría docente (HU-1.3, HU-2.1, HU-2.2)' }
  - { name: courses, description: 'Cursos e inscripción (HU-5.3)' }
  - { name: analytics, description: 'Analítica de participación (HU-2.3)' }
  - { name: study, description: 'Estudio con repetición espaciada SM-2 (HU-4.1)' }
  - { name: users, description: 'Perfil académico (HU-5.2)' }
  - { name: students, description: 'Contexto académico del estudiante' }
  - { name: aportes, description: 'Aportes y coautorías' }
  - { name: quizzes, description: 'Quices (HU-3.1, HU-3.2, HU-3.3)' }
  - { name: enrichment, description: 'Familias de palabras con WordNet (HU-4.2)' }
  - { name: dictionary, description: 'Diccionario global' }
  - { name: reports, description: 'Reportes en PDF (HU-018, HU-019, HU-021)' }
paths:
  # ======================= auth =======================
  /auth/google:
    post:
      tags: [auth]
      operationId: iniciarSesionGoogle
      summary: Inicia sesión con Google
      description: |
        Público. Verifica el `idToken` de Google Identity Services y, si el correo está registrado
        y activo, devuelve el JWT de la plataforma (8 h, HS256) con los claims `id_usuario`, `email` y `rol`.
        Límite de 20 intentos fallidos por IP cada 15 minutos (`RATE_LIMIT_AUTH_MAX`).
      x-hu: HU-5.4
      x-ca: [CA-5.4.1]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string, description: Credential que entrega Google Identity Services }
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: JWT de la plataforma }
                  usuario: { $ref: '#/components/schemas/UsuarioSesion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El correo no está registrado (AUTH_USER_NOT_REGISTERED).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/register:
    post:
      tags: [auth]
      operationId: registrarConGoogle
      summary: Registra un estudiante con Google
      description: |
        **Supuesto pendiente de validar (D-11):** el código exige que el correo termine en
        `@unicauca.edu.co` (`RegistroService.js`); no está confirmado como regla oficial.

        Público. Crea la cuenta con rol `estudiante` a partir del `idToken` de Google y devuelve
        el mismo token y usuario que el login. No usa contraseña (el registro es solo con Google).
      x-hu: HU-5.1
      x-ca: [CA-5.1.1, CA-5.1.2]
      x-pendiente: 'D-11: dominio @unicauca.edu.co validado en el código, sin confirmar como regla oficial'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string, example: Usuario registrado correctamente }
                  token: { type: string }
                  usuario: { $ref: '#/components/schemas/UsuarioSesion' }
        '400':
          description: Falta `idToken` (AUTH_GOOGLE_TOKEN_MISSING) o el correo no es institucional (REGISTER_INVALID_DOMAIN).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: El correo ya tiene cuenta (REGISTER_EMAIL_TAKEN).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  # ======================= decks =======================
  /decks:
    post:
      tags: [decks]
      operationId: crearMazo
      summary: Crea un mazo
      description: |
        **Supuesto pendiente de validar (D-09):** el DER exige `curso_id`, `fecha_apertura` y `fecha_cierre`.
        El controlador valida `nombre_lectura`, `semana`, `autor`, `fecha_apertura` y `fecha_cierre`, pero NO
        valida `curso_id`: si falta, el INSERT falla y responde 500.

        Solo docente. El `docente_id` sale del token (no del body). El mazo siempre se crea en estado
        `abierto` (CA-1.1.1); el `estado` y la `fecha_creacion` que vengan en el body se ignoran.
      x-hu: HU-1.1
      x-ca: [CA-1.1.1, CA-1.1.2]
      x-pendiente: 'D-09: curso_id es NOT NULL en el DER pero el controlador no lo valida (500 si falta)'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_lectura, semana, autor, fecha_apertura, fecha_cierre]
              properties:
                curso_id: { type: integer, description: 'Obligatorio en el DER; el controlador no lo valida (D-09)' }
                nombre_lectura: { type: string, maxLength: 200 }
                autor: { type: string, maxLength: 150 }
                semana: { type: integer }
                variante_regional_predeterminada: { type: string, maxLength: 100 }
                fecha_apertura: { type: string, format: date }
                fecha_cierre: { type: string, format: date }
      responses:
        '201':
          description: Mazo creado en estado abierto.
          content: { application/json: { schema: { $ref: '#/components/schemas/Mazo' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [decks]
      operationId: listarMazos
      summary: Lista los mazos
      description: |
        Token opcional. Sin token (Invitado, CA-5.4.3) o con rol docente devuelve todos los mazos;
        un estudiante con sesión recibe solo los de los cursos donde tiene inscripción activa (CA-1.2.1).
      x-hu: HU-1.2
      x-ca: [CA-1.2.1, CA-5.4.3]
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Lista de mazos.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Mazo' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /decks/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [decks]
      operationId: obtenerMazo
      summary: Obtiene un mazo
      description: |
        **Supuesto pendiente de validar:** este endpoint es público en el código actual (no pide token).

        Endpoint de apoyo para el frontend.
      x-hu: HU-1.1
      x-pendiente: 'Endpoint público: el código no pide token'
      security: []
      responses:
        '200':
          description: El mazo.
          content: { application/json: { schema: { $ref: '#/components/schemas/Mazo' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [decks]
      operationId: actualizarMazo
      summary: Edita un mazo
      description: |
        Solo la docente dueña del mazo (403 DECK_NOT_OWNER si no). Los campos que no vengan conservan su valor.
        Solo se pueden cambiar `nombre_lectura`, `autor`, `semana`, `variante_regional_predeterminada`,
        `fecha_apertura` y `fecha_cierre`; el estado se cambia con PATCH /decks/{id}/estado.
        Cambiar aquí la variante NO la propaga a las tarjetas (para eso está /default-variant).
      x-hu: HU-1.1
      x-ca: [CA-1.1.2]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre_lectura: { type: string, maxLength: 200 }
                autor: { type: string, maxLength: 150 }
                semana: { type: integer }
                variante_regional_predeterminada: { type: string, maxLength: 100 }
                fecha_apertura: { type: string, format: date }
                fecha_cierre: { type: string, format: date }
      responses:
        '200':
          description: Mazo actualizado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Mazo' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [decks]
      operationId: eliminarMazo
      summary: Elimina un mazo
      description: |
        Solo la docente dueña del mazo. Si el mazo todavía tiene tarjetas asociadas, la foreign key
        impide borrarlo y responde 500.
      x-hu: HU-1.1
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Mazo eliminado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Eliminado' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /decks/{id}/estado:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [decks]
      operationId: cambiarEstadoMazo
      summary: Abre o cierra un mazo
      description: |
        Cualquier docente puede abrir o cerrar cualquier mazo, sin importar quién lo creó (decisión del
        equipo, 2026-11-11); un estudiante recibe 403. Un mazo `cerrado` no acepta nuevos aportes
        (CA-1.1.3; la verificación está en POST /decks/{id}/cards).
      x-hu: HU-1.1
      x-ca: [CA-1.1.3]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [abierto, cerrado] }
      responses:
        '200':
          description: Mazo con el estado nuevo.
          content: { application/json: { schema: { $ref: '#/components/schemas/Mazo' } } }
        '400':
          description: Id inválido, falta `estado` o no es válido (INVALID_STATUS_VALUE).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /decks/{id}/default-variant:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [decks]
      operationId: asignarVarianteMazo
      summary: Asigna la variante regional a todo el mazo
      description: |
        **Supuesto pendiente de validar:** CLAUDE.md dice que el body usa `variante_dialectal`,
        pero el código lee `variante_regional`. Aquí se documenta el del código.

        Solo la docente dueña del mazo. Guarda la variante como predeterminada del mazo y la propaga a
        todas sus tarjetas, sobrescribiendo la etiqueta `variante_regional` de cada una (CA-2.2.2).
      x-hu: HU-2.2
      x-ca: [CA-2.2.2]
      x-pendiente: 'CLAUDE.md dice variante_dialectal; el código lee variante_regional'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variante_regional]
              properties:
                variante_regional:
                  type: string
                  description: Sin distinguir mayúsculas.
                  enum: [británico, nigeriano, jamaicano, inglés ghanés, estadounidense]
      responses:
        '200':
          description: Mazo actualizado y cantidad de tarjetas modificadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mazo: { $ref: '#/components/schemas/Mazo' }
                  tarjetas_actualizadas: { type: integer }
        '400':
          description: Id inválido, falta `variante_regional` o no es válida (CONTEXT_INVALID_VARIANT).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /decks/{id}/cards:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [decks]
      operationId: registrarTarjeta
      summary: Registra una palabra en el mazo
      description: |
        **Supuesto pendiente de validar (D-08):** el índice único `tarjeta (mazo_id, palabra)` impide guardar
        una acepción como tarjeta nueva. El código, si la palabra ya existe en el mazo, NO crea tarjeta:
        registra un `aporte` sobre la existente con `tipo_aporte` `coautoria` (misma definición y ejemplo,
        CA-1.3.1) o `acepcion_nueva` (CA-1.3.2). La comparación de la palabra ignora mayúsculas (CA-1.3.3).

        Requiere sesión (cualquier rol). El usuario del token debe tener inscripción activa en el curso del
        mazo (403 DECK_NOT_ENROLLED) y el mazo debe estar `abierto` (409 DECK_CLOSED, CA-1.2.3). La tarjeta
        nueva queda en `pendiente_revision` con un aporte tipo `creada` (CA-1.2.1).
      x-hu: HU-1.2
      x-ca: [CA-1.2.1, CA-1.2.2, CA-1.2.3, CA-1.3.1, CA-1.3.2, CA-1.3.3, CA-1.3.4]
      x-pendiente: 'D-08: las acepciones se guardan como aporte (coautoria / acepcion_nueva), no como tarjeta'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [palabra, traduccion, definicion]
              properties:
                palabra: { type: string, maxLength: 150 }
                traduccion: { type: string, maxLength: 255 }
                definicion: { type: string }
                ejemplo: { type: string, maxLength: 150 }
      responses:
        '201':
          description: Tarjeta creada, o aporte agregado a una tarjeta existente.
          content: { application/json: { schema: { $ref: '#/components/schemas/ResultadoRegistroTarjeta' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El mazo está cerrado (DECK_CLOSED).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/InternalError' }
  /decks/{id}/export-pdf:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [decks]
      operationId: exportarMazoPdf
      summary: Exporta el mazo a PDF
      description: |
        Solo docente (decisión D-07). PDF listo para imprimir con las tarjetas `revisado_docente` del mazo:
        términos, traducciones, definiciones y contexto.
      x-hu: HU-3.3
      x-ca: [CA-3.3.1, CA-3.3.3]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Pdf' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  # ======================= cards =======================
  /cards/check-duplicate:
    post:
      tags: [cards]
      operationId: verificarDuplicado
      summary: Revisa si una palabra ya existe en el mazo
      description: |
        **Supuesto pendiente de validar (D-08):** igual que POST /decks/{id}/cards, un duplicado se resuelve
        como aporte `coautoria` (misma definición y ejemplo) o `acepcion_nueva`, nunca como tarjeta nueva.

        Requiere sesión (cualquier rol). No crea ni modifica nada: el frontend lo llama antes de enviar el
        formulario para mostrar el aviso de coautoría o acepción nueva (CA-1.3.4). La comparación de la
        palabra ignora mayúsculas (CA-1.3.3).
      x-hu: HU-1.3
      x-ca: [CA-1.3.1, CA-1.3.2, CA-1.3.3, CA-1.3.4]
      x-pendiente: 'D-08: las acepciones se guardan como aporte (coautoria / acepcion_nueva), no como tarjeta'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mazo_id, palabra]
              properties:
                mazo_id: { type: integer }
                palabra: { type: string }
                definicion: { type: string, description: Para distinguir coautoría de acepción nueva }
                ejemplo: { type: string }
      responses:
        '200':
          description: Resultado de la verificación. `tarjeta` solo viene si hay duplicado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicado: { type: boolean }
                  resultado: { type: string, enum: [creada, coautoria, acepcion_nueva] }
                  tarjeta: { $ref: '#/components/schemas/Tarjeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /cards/pending:
    get:
      tags: [cards]
      operationId: listarTarjetasPendientes
      summary: Lista las tarjetas pendientes de revisión
      description: |
        **Supuesto pendiente de validar (D-10):** CLAUDE.md menciona dos rutas para este filtro; la única
        implementada y montada es esta. `GET /decks/{id}/cards?estado=...` no existe en el código.

        Solo docente. Tarjetas en `pendiente_revision` de todos los mazos, con el nombre del estudiante
        que la creó, para el panel de curaduría.
      x-hu: HU-2.1
      x-ca: [CA-2.1.1]
      x-pendiente: 'D-10: solo existe GET /cards/pending; GET /decks/{id}/cards?estado=... no está implementada'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tarjetas pendientes.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TarjetaPendiente' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /cards/approved:
    get:
      tags: [cards]
      operationId: listarTarjetasAprobadas
      summary: Lista las tarjetas aprobadas
      description: |
        Solo docente. Endpoint adicional pedido por el equipo (fuera de los CA de HE-02) para la pestaña
        "Historial Aprobadas" del panel de curaduría. Cada tarjeta trae su registro, su variante regional y
        el autor original.
      x-hu: HU-2.1
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tarjetas en `revisado_docente`.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TarjetaAprobada' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /cards/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [cards]
      operationId: obtenerTarjeta
      summary: Obtiene una tarjeta con sus etiquetas de contexto
      description: |
        **Supuesto pendiente de validar:** este endpoint es público en el código actual (no pide token).

        Devuelve la tarjeta con `etiquetas_contexto` (registro y variante regional) para mostrarlas en su
        detalle (CA-2.2.3).
      x-hu: HU-2.2
      x-ca: [CA-2.2.3]
      x-pendiente: 'Endpoint público: el código no pide token'
      security: []
      responses:
        '200':
          description: La tarjeta.
          content: { application/json: { schema: { $ref: '#/components/schemas/TarjetaDetalle' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [cards]
      operationId: editarTarjetaEnRevision
      summary: Corrige una tarjeta pendiente
      description: |
        Solo docente. Edita una tarjeta en `pendiente_revision` antes de aprobarla (CA-2.1.2). Los campos
        que no vengan conservan su valor. Si la tarjeta ya no está pendiente responde 409 CARD_NOT_PENDING.
      x-hu: HU-2.1
      x-ca: [CA-2.1.2]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                palabra: { type: string, maxLength: 150 }
                traduccion: { type: string, maxLength: 255 }
                definicion: { type: string }
                ejemplo: { type: string, maxLength: 150 }
      responses:
        '200':
          description: Tarjeta corregida.
          content: { application/json: { schema: { $ref: '#/components/schemas/Tarjeta' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /cards/{id}/context:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [cards]
      operationId: actualizarContextoTarjeta
      summary: Asigna registro y variante regional a una tarjeta
      description: |
        Solo docente. Reemplaza la etiqueta de cada tipo que venga en el body (al menos una;
        400 CONTEXT_EMPTY si no viene ninguna). Los valores se comparan sin distinguir mayúsculas.
      x-hu: HU-2.2
      x-ca: [CA-2.2.1]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registro: { type: string, enum: [formal, informal, slang, coloquial, anticuado] }
                variante_regional: { type: string, enum: [británico, nigeriano, jamaicano, inglés ghanés, estadounidense] }
      responses:
        '200':
          description: Etiquetas guardadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje: { type: string, example: Contexto actualizado correctamente }
                  etiquetas: { type: array, items: { $ref: '#/components/schemas/EtiquetaContexto' } }
        '400':
          description: Id inválido, sin etiquetas (CONTEXT_EMPTY) o con un valor no permitido (CONTEXT_INVALID_REGISTER, CONTEXT_INVALID_VARIANT).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /cards/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [cards]
      operationId: aprobarTarjeta
      summary: Aprueba una tarjeta
      description: |
        **Supuesto pendiente de validar:** CA-2.1.3 (rechazar con observación) no existe en el código. No hay
        endpoint de rechazo; en la revisión individual la docente solo corrige (PUT /cards/{id}) o aprueba.

        Solo docente. Pasa la tarjeta de `pendiente_revision` a `revisado_docente` y registra `fecha_revision`;
        así queda disponible para los quices. 409 CARD_NOT_PENDING si ya no estaba pendiente.
      x-hu: HU-2.1
      x-ca: [CA-2.1.2]
      x-pendiente: 'CA-2.1.3 (rechazo) no está implementado: no hay endpoint de rechazo'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tarjeta aprobada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Tarjeta' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  # ======================= courses =======================
  /courses:
    post:
      tags: [courses]
      operationId: crearCurso
      summary: Crea un curso
      description: |
        Solo docente. El `docente_id` sale del token (no del body). Valida que vengan todos los campos
        (NOT NULL en el DER) y sus longitudes máximas.
      x-hu: HU-5.3
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, periodo, estado, fecha_inicio, fecha_fin]
              properties:
                nombre: { type: string, maxLength: 150 }
                periodo: { type: string, maxLength: 20, example: 2026-2 }
                estado: { type: string, maxLength: 30 }
                fecha_inicio: { type: string, format: date }
                fecha_fin: { type: string, format: date }
      responses:
        '201':
          description: Curso creado.
          content: { application/json: { schema: { $ref: '#/components/schemas/Curso' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [courses]
      operationId: listarCursos
      summary: Lista los cursos
      description: Token opcional. Todos los cursos, sin filtros. `codigo_acceso` solo se incluye si quien consulta es docente.
      x-hu: HU-5.3
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Lista de cursos.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Curso' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /courses/enroll:
    post:
      tags: [courses]
      operationId: inscribirsePorCodigo
      summary: Se inscribe en un curso con el código de acceso
      description: |
        **Supuesto pendiente de validar (D-04):** CLAUDE.md dice que `curso` no tiene columna para el código,
        pero `init.sql` ya tiene `curso.codigo_acceso VARCHAR(20) UNIQUE` y el código la usa. Falta cerrar D-04.

        Solo estudiante. El `estudiante_id` sale del token. El código se normaliza (sin espacios y en mayúsculas).
        La inscripción queda `activa`.
      x-hu: HU-5.3
      x-ca: [CA-5.3.1]
      x-pendiente: 'D-04: curso.codigo_acceso ya existe en init.sql; falta cerrar la discrepancia en CLAUDE.md'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo_acceso]
              properties:
                codigo_acceso: { type: string, maxLength: 20 }
      responses:
        '201':
          description: Inscripción creada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Inscripcion' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El código no corresponde a ningún curso (ENROLL_INVALID_CODE).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Ya está inscrito en el curso (ENROLL_ALREADY_ENROLLED).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/InternalError' }
  /courses/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [courses]
      operationId: obtenerCurso
      summary: Obtiene un curso
      description: Token opcional. `codigo_acceso` solo se incluye si quien consulta es docente.
      x-hu: HU-5.3
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: El curso.
          content: { application/json: { schema: { $ref: '#/components/schemas/Curso' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /courses/{id}/access-code:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [courses]
      operationId: generarCodigoAcceso
      summary: Genera el código de acceso del curso
      description: |
        **Supuesto pendiente de validar (D-04):** CLAUDE.md dice que `curso` no tiene columna para el código,
        pero `init.sql` ya tiene `curso.codigo_acceso VARCHAR(20) UNIQUE` y el código la usa. Falta cerrar D-04.

        Solo docente. Genera un código aleatorio de 8 caracteres (con `node:crypto`), único entre los cursos,
        y lo guarda en el curso (reemplaza el anterior).
      x-hu: HU-5.3
      x-ca: [CA-5.3.1]
      x-pendiente: 'D-04: curso.codigo_acceso ya existe en init.sql; falta cerrar la discrepancia en CLAUDE.md'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Código generado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_curso: { type: integer }
                  codigo_acceso: { type: string, maxLength: 20 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /courses/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [courses]
      operationId: asignarEstudiantePorCorreo
      summary: Inscribe a un estudiante por su correo
      description: Solo docente. Busca al estudiante por correo y lo inscribe en el curso con estado `activa`.
      x-hu: HU-5.3
      x-ca: [CA-5.3.2]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201':
          description: Inscripción creada.
          content: { application/json: { schema: { $ref: '#/components/schemas/Inscripcion' } } }
        '400':
          description: Id inválido, falta `email` o el usuario no es estudiante (USER_NOT_STUDENT).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El curso no existe (COURSE_NOT_FOUND) o no hay estudiante con ese correo (STUDENT_NOT_FOUND).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: El estudiante ya está inscrito (ENROLL_ALREADY_ENROLLED).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/InternalError' }
  /courses/{id}/students:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [courses]
      operationId: listarEstudiantesCurso
      summary: Lista los estudiantes inscritos en el curso
      description: Solo docente. Cada estudiante con su nivel, su código estudiantil y la cantidad de palabras aportadas.
      x-hu: HU-5.3
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Estudiantes del curso.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EstudianteCurso' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ======================= analytics =======================
  /teacher/analytics/deck/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [analytics]
      operationId: resumenParticipacionMazo
      summary: Resumen de participación por mazo
      description: |
        Solo docente. Una fila por estudiante inscrito en el curso del mazo, con palabras aportadas,
        coautorías y tarjetas pendientes o aprobadas (CA-2.3.1). Con `sinAportes=true` solo devuelve a quienes
        no tienen ningún aporte en el mazo (CA-2.3.2). No usa caché: cada consulta refleja el estado actual de
        la base de datos (así se cubre CA-2.3.3, sin WebSockets).
      x-hu: HU-2.3
      x-ca: [CA-2.3.1, CA-2.3.2, CA-2.3.3]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sinAportes
          in: query
          required: false
          schema: { type: string, enum: ['true'] }
          description: Con `true`, solo estudiantes sin aportes en el mazo.
      responses:
        '200':
          description: Participación por estudiante.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ParticipacionMazo' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ======================= study =======================
  /study/review-session:
    post:
      tags: [study]
      operationId: iniciarSesionRepaso
      summary: Inicia una sesión de repaso
      description: |
        Solo estudiante, y la inscripción debe ser suya (403 ENROLLMENT_FORBIDDEN si no, también si no existe).
        Devuelve todas las tarjetas `revisado_docente` de los mazos ya abiertos del curso, ordenadas por SM-2:
        primero las vencidas, luego las nuevas y luego las demás. Cada una trae su `progreso` (null si es nueva).
      x-hu: HU-4.1
      x-ca: [CA-4.1.1]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inscripcion_id]
              properties:
                inscripcion_id: { type: integer }
      responses:
        '200':
          description: Tarjetas de la sesión.
          content: { application/json: { schema: { $ref: '#/components/schemas/SesionRepaso' } } }
        '400':
          description: Falta o es inválido `inscripcion_id`, o la inscripción no está activa (ENROLLMENT_INACTIVE).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /study/review-session/review:
    post:
      tags: [study]
      operationId: registrarValoracion
      summary: Registra la valoración de una tarjeta
      description: |
        Solo estudiante, y la inscripción debe ser suya. Aplica SM-2 para recalcular el factor de facilidad,
        el intervalo y la próxima fecha de repaso (CA-4.1.2).
      x-hu: HU-4.1
      x-ca: [CA-4.1.2]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inscripcion_id, tarjeta_id, valoracion]
              properties:
                inscripcion_id: { type: integer }
                tarjeta_id: { type: integer }
                valoracion: { type: string, enum: [Repetir, Difícil, Buena, Fácil] }
      responses:
        '200':
          description: Progreso actualizado.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProgresoEstudio' } } }
        '400':
          description: Faltan campos, ids inválidos o valoración no válida (STUDY_INVALID_RATING).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La tarjeta no está disponible para esa inscripción (STUDY_CARD_NOT_AVAILABLE).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/InternalError' }

  # ======================= users =======================
